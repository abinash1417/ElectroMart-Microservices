server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://localhost:3306/electromart_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_db_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

app.jwt.secret=electromart-super-secret-jwt-key-change-this-in-production-please
app.jwt.expiration-ms=86400000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_gmail_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mvc.pathmatch.use-suffix-pattern=false
spring.web.resources.add-mappings=false
spring.jackson.serialization.fail-on-empty-beans=false

# Admin Configuration
admin.name=your_admin_name
admin.email=your_admin_email@example.com
admin.password=your_admin_password

eureka.instance.prefer-ip-address=true

