server.port=8080
spring.application.name=gateway-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# CORS configuration for Gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# ─────────────────────────────────────────────────────────────────────────────
# Gateway routes (matched top-to-bottom in index order)
# ─────────────────────────────────────────────────────────────────────────────

# 0. Auth service routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**, /api/password/**, /api/admin/**, /api/contact/**, /api/emails/**

# 1. Product service routes (includes /images/** for static product images)
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/products/**, /categories/**, /api/categories/**, /api/reviews/**, /images/**

# 2. Cart service routes
spring.cloud.gateway.routes[2].id=cart-service
spring.cloud.gateway.routes[2].uri=lb://cart-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/cart/**, /api/wishlist/**

# 3. Order service routes
spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=lb://order-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/orders/**

# 4. Payment service routes
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**

# 5. AI service routes
spring.cloud.gateway.routes[5].id=ai-service
spring.cloud.gateway.routes[5].uri=lb://ai-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ai/**

# JWT Secret config for Gateway validation
app.jwt.secret=electromart-super-secret-jwt-key-change-this-in-production-please
